<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNotes Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>QuickNotes Pro</h1>
    <p>Think it. Type it. Keep it secure.</p>
  </header>

  <main>
    <!-- Add Note Workspace Card -->
    <section class="app-card">
      <h2>Add a new note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="note-input">Note Content</label>
          <input type="text" id="note-input" placeholder="What's on your mind?..." autocomplete="off" />
        </div>
        
        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>

        <button type="submit" id="submit-btn">Add Note</button>
      </form>
      
      <!-- Error Display Anchor Box -->
      <p id="error-message"></p>
    </section>

    <!-- Notes Dashboard Display Workspace Card -->
    <section class="app-card">
      <h2>Your Dashboard Workspace</h2>
      
      <div class="search-utilities">
        <label for="search-input" class="visually-hidden">Search active notes</label>
        <input type="text" id="search-input" placeholder="🔍 Search through active notes..." autocomplete="off" />
      </div>

      <div class="status-summary-bar">
        <p id="note-count">You have no notes yet.</p>
        <button id="clear-all-btn" class="hidden">Clear All Workspace</button>
      </div>

      <!-- Live Dynamic DOM Append Target -->
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes App. Built during Web Foundations Core Track.</p>
  </footer>

</body>
</html>
